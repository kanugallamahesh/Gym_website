<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitZone Gym</title>
<link rel="Stylesheet" href="Style.css">
</head>

<body>
<nav>
    <h2>FitZone Gym</h2>

    <div class="menu">
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#plans">Plans</a>
        <a href="#contact">Contact</a>

        <label class="theme-switch">
            <input type="checkbox" id="darkToggle">
            <span class="slider"></span>
        </label>
    </div>
</nav>

<section class="hero" id="home">
    <h1>Transform Your Body</h1>
    <p>Join FitZone Gym and achieve your fitness goals.</p>
</section>

<section class="plans" id="plans">
    <h2>Membership Plans</h2>
    <div class="plan-container">
        <div class="card"><h3>Basic</h3><p>₹999</p></div>
        <div class="card"><h3>Standard</h3><p>₹1999</p></div>
        <div class="card"><h3>Premium</h3><p>₹2999</p></div>
    </div>
</section>

<section class="about" id="about">
    <h2>About Gym</h2>
    <p>Modern equipment & training.</p>
</section>

<section class="gallery">
    <h2>Gallery</h2>
    <div class="gallery-container">
        <img src="https://images.unsplash.com/photo-1517836357463-d25dfeac3438">
        <img src="https://images.unsplash.com/photo-1583454110551-21f2fa2afe61">
        <img src="https://images.unsplash.com/photo-1554284126-aa88f22d8b74">
    </div>
</section>

<footer>
    <h3>FitZone Gym</h3>
    <p>© 2026</p>
</footer>

<script src="script.js"></script>

</body>
</html>
